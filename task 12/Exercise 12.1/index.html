<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 12.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- Margin utilities -->
        <div class="bg-primary text-white p-2 m-3">
            Section with m-3 (margin on all sides)
        </div>

        <div class="bg-success text-white p-2 mt-4">
            Section with mt-4 (top margin only)
        </div>

        <!-- Padding utilities -->
        <div class="bg-warning p-2 mt-4">
            Section with p-2 (padding on all sides)
        </div>

        <div class="bg-info text-white py-5 mt-4">
            Section with py-5 (vertical padding)
        </div>

    </div>

</body>
</html>
