<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 12.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<section class="container py-5">

    <h2 class="text-center mb-5">Pricing Plans</h2>

    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center">
                <h3>Basic</h3>
                <h1 class="my-3">$9</h1>
                <p>1 User</p>
                <p>5 GB Storage</p>
                <button class="btn btn-primary mt-3">Choose Plan</button>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center border-primary">
                <h3>Standard</h3>
                <h1 class="my-3">$19</h1>
                <p>5 Users</p>
                <p>50 GB Storage</p>
                <button class="btn btn-primary mt-3">Choose Plan</button>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center">
                <h3>Premium</h3>
                <h1 class="my-3">$29</h1>
                <p>Unlimited Users</p>
                <p>200 GB Storage</p>
                <button class="btn btn-primary mt-3">Choose Plan</button>
            </div>
        </div>

    </div>

</section>

</body>
</html>
