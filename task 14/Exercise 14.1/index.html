<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 14.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Responsive Display Example</h1>

    <!-- Hidden on all screens -->
    <div class="d-none bg-danger text-white p-3 mb-3">
        This section is hidden everywhere.
    </div>

    <!-- Hidden on small screens, visible on md and above -->
    <div class="d-none d-md-block bg-primary text-white p-3 mb-3">
        Visible on Medium (≥768px) and larger screens.
    </div>

    <!-- Hidden until lg screens, then becomes flex -->
    <div class="d-none d-lg-flex bg-success text-white p-3 justify-content-between">
        <span>Item 1</span>
        <span>Item 2</span>
        <span>Item 3</span>
    </div>

</div>

</body>
</html>
