<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9.2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Bootstrap Button Groups</h2>

    <h4>Basic Button Group</h4>
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-primary">Left</button>
        <button type="button" class="btn btn-primary">Middle</button>
        <button type="button" class="btn btn-primary">Right</button>
    </div>

    <hr>

    <h4>Colored Button Group</h4>
    <div class="btn-group" role="group">
        <button class="btn btn-success">Success</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-danger">Danger</button>
    </div>

    <hr>

    <h4>Toggle Buttons (Checkboxes)</h4>

    <input type="checkbox" class="btn-check" id="html" autocomplete="off">
    <label class="btn btn-outline-primary" for="html">HTML</label>

    <input type="checkbox" class="btn-check" id="css" autocomplete="off">
    <label class="btn btn-outline-success" for="css">CSS</label>

    <input type="checkbox" class="btn-check" id="js" autocomplete="off">
    <label class="btn btn-outline-warning" for="js">JavaScript</label>

    <hr>

    <h4>Checkbox Toggle Group</h4>

    <div class="btn-group" role="group">
        <input type="checkbox" class="btn-check" id="c" autocomplete="off">
        <label class="btn btn-outline-primary" for="c">C</label>

        <input type="checkbox" class="btn-check" id="cpp" autocomplete="off">
        <label class="btn btn-outline-success" for="cpp">C++</label>

        <input type="checkbox" class="btn-check" id="java" autocomplete="off">
        <label class="btn btn-outline-danger" for="java">Java</label>
    </div>

</div>

</body>
</html>
