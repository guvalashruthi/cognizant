<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 11.2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex align-items-start border p-3 rounded">

        <img src="image.png"
             class="me-3 rounded"
             style="height: 400px;width: 400px;"
             alt="Image">

        <div>
            <h5>Media Object Title</h5>
            <p>
                This is an example of a media object layout in Bootstrap 5.
                The image is aligned to the left, while the content appears on the right.
                Flexbox utilities are used because the original media component was removed.
            </p>
        </div>

    </div>

</div>

</body>
</html>
