<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Example</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Community Events</h2>

    <div class="eventCard">
        <h3>Music Festival</h3>
        <p>Enjoy live music performances and entertainment.</p>
    </div>

    <div class="eventCard">
        <h3>Food Carnival</h3>
        <p>Experience delicious cuisines from various regions.</p>
    </div>

    <form>
        <label>Name:</label><br>
        <input type="text" class="highlightField"><br><br>

        <label>Email:</label><br>
        <input type="email"><br><br>
    </form>

    <div class="hiddenBox">
        This box uses visibility: hidden
    </div>

    <div class="noneBox">
        This box uses display: none
    </div>

    <div class="normalBox">
        This is a visible box after hidden and none examples.
    </div>

</body>
</html>
