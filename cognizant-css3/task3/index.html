<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Banner using ID Selector -->
    <header id="mainHeader">
        <h1>College Event Portal</h1>
    </header>

    <!-- Element Selector Example -->
    <h2>Upcoming Events</h2>

    <!-- Class Selector Example -->
    <div class="eventCard">
        <h3>Tech Fest 2026</h3>
        <p>Join us for coding contests, workshops, and fun activities.</p>
    </div>

    <div class="eventCard">
        <h3>Sports Meet</h3>
        <p>Participate in various sports competitions and win prizes.</p>
    </div>

</body>
</html>
