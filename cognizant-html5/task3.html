<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>

    <style>
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            border-radius: 10px;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div id="welcomeBanner">
        Welcome Back, Resident!
    </div>

    <br>

    <p class="highlight">
        Community Festival Registration is Open!
    </p>

    <p>
        Register today and get
        <span style="color:red; font-weight:bold;">
            50% OFF
        </span>
        on premium event passes.
    </p>

</body>

</html>
