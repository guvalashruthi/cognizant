<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form-container {
            width: 400px;
            background-color: white;
            padding: 20px;
            margin: auto;
            margin-top: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            font-size: 18px;
            border-radius: 5px;
        }

        output {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Event Registration</h2>

        <form onsubmit="showMessage(); return false;">

            <input type="text"
                   placeholder="Enter your name"
                   required
                   autofocus>

            <input type="email"
                   placeholder="Enter your email"
                   required>

            <input type="date" required>

            <select required>
                <option value="">Select Event</option>
                <option>Music Festival</option>
                <option>Food Carnival</option>
                <option>Sports Meet</option>
            </select>

            <textarea rows="4"
                      placeholder="Enter your message"
                      required></textarea>

            <button type="submit">
                Register
            </button>

            <br><br>

            <output id="result"></output>

        </form>
    </div>

    <script>
        function showMessage() {
            document.getElementById("result").innerHTML =
                "Registration Successful!";
        }
    </script>

</body>

</html>
